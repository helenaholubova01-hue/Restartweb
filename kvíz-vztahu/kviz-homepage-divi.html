<style>
.rm-hero {
    position: relative;
    min-height: 90vh;
    display: flex;
    align-items: center;
}

/* Overlay — cílí na Divi sekci, přidej třídu "rm-hero-section" na sekci v Divi */
.rm-hero-section {
    position: relative;
}
.rm-hero-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        linear-gradient(to right, rgba(5,13,23,0.92) 35%, rgba(5,13,23,0.55) 60%, rgba(5,13,23,0.2) 100%),
        linear-gradient(to top, rgba(5,13,23,0.7) 0%, transparent 40%);
    pointer-events: none;
    z-index: 1;
}

/* Obsah musí být nad overlayem */
.rm-hero-section .rm-hero-left {
    z-index: 2;
}

/* Starý overlay div — schovaný */
.rm-hero-overlay { display: none; }

/* Levá část — text */
.rm-hero-left {
    position: relative;
    z-index: 2;
    padding: 5rem 4rem 5rem 5rem;
}


/* ── NOVINKA BADGE ── */
.rm-hero-new {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.75rem;
    padding: 0.45rem 0.9rem 0.45rem 0.5rem;
    background: rgba(192,32,42,0.15);
    border: 1px solid rgba(192,32,42,0.5);
    border-radius: 100px;
    width: fit-content;
}
.rm-hero-new-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: #c0202a;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 100px;
    animation: rm-pill-pop 1.4s ease-in-out infinite;
}
.rm-hero-new-pill::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    flex-shrink: 0;
    animation: rm-dot-blink 1.4s ease-in-out infinite;
}
@keyframes rm-dot-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
}
@keyframes rm-pill-pop {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,32,42,0.6); }
    50%       { box-shadow: 0 0 0 8px rgba(192,32,42,0); }
}
.rm-hero-new-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
}
.rm-hero-new-dot { display: none; }

/* Rohový badge — schovaný */
.rm-hero-badge { display: none; }

.rm-hero h2 {
    font-family: 'Montserrat', sans-serif !important;
    font-weight: 800 !important;
    font-size: clamp(2.8rem, 4.5vw, 4.2rem) !important;
    line-height: 1.1 !important;
    color: #ffffff !important;
    margin-bottom: 1.75rem !important;
    letter-spacing: -0.02em;
}

.rm-hero h2 em {
    font-style: normal;
    color: #e87722;
}

.rm-hero-lead {
    font-size: clamp(1rem, 1.5vw, 1.15rem);
    line-height: 1.75;
    color: #ffffff;
    margin-bottom: 2.5rem;
    max-width: 520px;
}

.rm-hero-cta {
    display: inline-flex !important;
    align-items: center;
    gap: 0.75rem;
    background: #3f9626 !important;
    color: #fff !important;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1.1rem 2.5rem !important;
    border-radius: 100px !important;
    text-decoration: none !important;
    transition: background 0.25s ease, transform 0.2s ease;
    margin-bottom: 1rem;
    border: none !important;
    box-shadow: none !important;
}
@media (hover: hover) {
    .rm-hero-cta:hover {
        background: #4db82e !important;
        transform: scale(1.04);
    }
}

.rm-hero-meta {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
}
.rm-hero-meta-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.06em;
}
.rm-hero-meta-item svg {
    width: 0.9rem;
    height: 0.9rem;
    color: #3f9626;
    flex-shrink: 0;
}
.rm-hero-meta-item::before {
    content: '✓';
    color: #3f9626;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
}

/* Spodní přechod */
.rm-hero-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to top, #050d17, transparent);
    z-index: 3;
    pointer-events: none;
}


/* Responsive */
@media (max-width: 900px) {
    .rm-hero {
        min-height: auto;
    }
    .rm-hero-left {
        padding: 3rem 1.5rem 2.5rem;
    }
    .rm-hero-new {
        margin-bottom: 1.25rem;
    }
}
</style>

<section class="rm-hero">

    <div class="rm-hero-overlay" aria-hidden="true"></div>
    <div class="rm-hero-badge" aria-hidden="true"></div>

    <!-- LEVÁ ČÁST — text -->
    <div class="rm-hero-left">
        <div class="rm-hero-new">
            <span class="rm-hero-new-pill">Právě spuštěno</span>
            <span class="rm-hero-new-dot"></span>
            <span class="rm-hero-new-text">Nový kvíz &nbsp;·&nbsp; zdarma</span>
        </div>
        <h2>Víš, co Ti doma<br><em>skutečně</em> brání?</h2>
        <p class="rm-hero-lead">Odpověz na 5 otázek a zjistíš, co konkrétně ničí klid, respekt a vedení ve Tvém vztahu.</p>
        <a href="https://restartmuze.cz/kviz-vztahu/" class="rm-hero-cta">
            Spustit kvíz
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:1rem;height:1rem;flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        </a>
        <div class="rm-hero-meta">
            <span class="rm-hero-meta-item">2 minuty</span>
            <span class="rm-hero-meta-item">100% anonymní</span>
            <span class="rm-hero-meta-item">Hned výsledek</span>
        </div>
    </div>

    <div class="rm-hero-fade"></div>

</section>
