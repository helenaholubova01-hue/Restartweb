        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #050d17;
            --accent-orange: #e87722;
            --accent-green: #3f9626;
            --accent-green-hover: #4db82e;
            --text-white: #ffffff;
            --text-light: rgba(255,255,255,0.82);

        body {

            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', Arial, sans-serif;
            color: var(--text-white);
            padding: 2rem 1.25rem;
        }

        .wrap {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;

            line-height: 1.15;
            margin-bottom: 0.85rem;
            color: var(--text-white);
        }

        .lead {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .share-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 2rem;
        }

        .btn-share {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.95rem 1.5rem;
            border-radius: 100px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            width: 100%;
        }
        .btn-share:hover { transform: scale(1.03); filter: brightness(1.1); }
        .btn-share svg { width: 22px; height: 22px; flex-shrink: 0; }

        .btn-whatsapp  { background: #25D366; color: #fff; }
        .btn-email     { background: var(--accent-orange); color: #fff; }
        .btn-messenger { background: #0084FF; color: #fff; }
        .btn-copy      { background: rgba(255,255,255,0.08); color: var(--text-white); border: 1px solid var(--border); }
        .btn-copy.copied { background: rgba(63,150,38,0.2); border-color: var(--accent-green); color: var(--accent-green); }

        .back-link {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--text-light); }

        footer {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;

<script>
(function () {
    var BASE   = 'https://restartmuze.cz/kviz-vztahu/';
    var params = new URLSearchParams(window.location.search);
    var ref    = params.get('ref');

    var quizUrl = ref ? BASE + '?ref=' + encodeURIComponent(ref) : BASE;

    var msg = 'Hele chlape, zkus tenhle kvíz — Jak vrátit do vztahu klid, respekt a vedení za 3 dny. 2 minuty a budeš vědět, co Ti doma brání: ' + quizUrl;

    var subject = 'Jak vrátit do vztahu klid, respekt a vedení za 3 dny';
    var body    = 'Hele chlape,\n\nzkus tenhle kvíz — Jak vrátit do vztahu klid, respekt a vedení za 3 dny.\n\nTrvá 2 minuty a ukáže Ti, co Ti doma brání mít klid, respekt a vedení ve vztahu.\n\n' + quizUrl + '\n\nSláva Černý / Restart muže';

    document.getElementById('btn-whatsapp').href =
        'https://wa.me/?text=' + encodeURIComponent(msg);

    document.getElementById('btn-messenger').href =
        'https://www.facebook.com/dialog/send?link=' + encodeURIComponent(quizUrl) +
        '&app_id=966242223397117&redirect_uri=' + encodeURIComponent(quizUrl);

    document.getElementById('btn-email').href =
        'mailto:?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);

    window._quizUrl = quizUrl;
})();

function copyLink() {
    var url = window._quizUrl || 'https://restartmuze.cz/kviz-vztahu/';
    var btn = document.getElementById('btn-copy');
    var lbl = document.getElementById('copy-label');

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
            btn.classList.add('copied');
            lbl.textContent = 'Odkaz zkopírován ✓';
            setTimeout(function () {
                btn.classList.remove('copied');
                lbl.textContent = 'Zkopírovat odkaz';
            }, 2500);
        });
    } else {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        lbl.textContent = 'Odkaz zkopírován ✓';
        setTimeout(function () { lbl.textContent = 'Zkopírovat odkaz'; }, 2500);
    }
}
</script>
